name: build-snap
on:
  pull_request:
  push:
    branches:
      - desktop/26
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            suffix: ""
          - runner: ubuntu-26.04-arm
            suffix: "-arm64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          snapcraft-channel: edge
      - name: Normalize snap filename
        run: cp "${{ steps.snapcraft.outputs.snap }}" "pipewire${{ matrix.suffix }}.snap"
      - name: Publish to desktop-26-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-26-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create desktop-26-latest -R "$GITHUB_REPOSITORY" \
                 --title "desktop/26 latest snap" \
                 --notes "Rolling latest desktop/26 snap build; assets are replaced on every green build."
          gh release upload desktop-26-latest "pipewire${{ matrix.suffix }}.snap" -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: snap${{ matrix.suffix }}
          path: "pipewire${{ matrix.suffix }}.snap"
          compression-level: 0
          retention-days: 14

  publish-26-edge:
    # Store publishing is manual-only (Actions tab -> Run workflow):
    # it needs the SNAPCRAFT_STORE_CREDENTIALS repo secret (owner-set,
    # minimal scopes via `snapcraft export-login`) and collaborator
    # rights on the "pipewire" snap name, and the "26" track must
    # already exist (create it once in the store dashboard). Uploads
    # the exact artifact the snap job built; promotion to 26/stable
    # happens separately (store dashboard) after VM verification.
    if: github.event_name == 'workflow_dispatch'
    needs: snap
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snap
      - name: Upload to the Snap Store (26/edge)
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          sudo snap install --classic snapcraft
          snapcraft upload pipewire.snap --release=26/edge
